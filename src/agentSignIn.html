<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agent SignIn</title>
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body>
        <div id="box">
            <div id="loginBox">
                <div id="inputBox">
                    <input
                        type="text"
                        placeholder="id"
                        class="input"
                        id="loginId"
                    />
                    <input
                        type="password"
                        placeholder="password"
                        class="input"
                        id="password"
                    />
                </div>
                <button id="signinBtn" class="button" disabled>로그인</button>
            </div>
            <a href="">회원가입</a>
        </div>

        <script>
            const loginIdInput = document.getElementById("loginId");
            const passwordInput = document.getElementById("password");
            const signinBtn = document.getElementById("signinBtn");

            //빈 입력값 체크 함수
            const checkInput = () => {
                const id = loginIdInput.value.trim();
                const password = passwordInput.value.trim();

                if (id !== "" && password !== "") {
                    signinBtn.disabled = false;
                } else {
                    signinBtn.disabled = true;
                }
            };

            // 로그인 요청 함수
            const signIn = async () => {
                const id = document.getElementById("loginId").value.trim();
                const password = document
                    .getElementById("password")
                    .value.trim();

                try {
                    const res = await fetch("/agentsignin", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({ id, password }),
                    });

                    const result = await res.json();

                    if (res.ok) {
                        alert("로그인 성공");
                    } else {
                        alert("로그인 실패: " + result.message);
                    }
                } catch (err) {
                    console.error("에러 발생:", err);
                    alert("서버 오류");
                }
            };

            //이벤트
            loginIdInput.addEventListener("input", checkInput);
            passwordInput.addEventListener("input", checkInput);

            //로그인 버튼 클릭 이벤트
            document
                .getElementById("signinBtn")
                .addEventListener("click", signIn);

            //엔터키 입력 이벤트
            document
                .getElementById("password")
                .addEventListener("keydown", (e) => {
                    if (e.key === "Enter" && signinBtn.disabled === false) {
                        signIn();
                    }
                });

            checkInput();
        </script>
    </body>
</html>
